<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu painel - Master Nuvem</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:radial-gradient(900px 500px at 15% -5%,#0b3a8f55,transparent),radial-gradient(800px 500px at 100% 10%,#6d28d933,transparent),#030a1c}
.glass{background:linear-gradient(160deg,#0c1a3dcc,#07102acc);border:1px solid #1e40af88;box-shadow:0 0 50px #38bdf822;backdrop-filter:blur(10px)}
.grad{background:linear-gradient(90deg,#38bdf8,#818cf8,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body class="text-white font-sans antialiased min-h-screen">

<nav class="border-b border-blue-900/50 bg-slate-950/60 backdrop-blur">
  <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
    <a href="/" class="font-bold text-xl">Master<span class="grad">Nuvem</span></a>
    <button type="button" id="sair" class="text-sm font-semibold text-blue-300 hover:text-white">Sair</button>
  </div>
</nav>

<main class="max-w-4xl mx-auto px-4 py-10">
  <div class="glass rounded-3xl p-8">
    <div class="flex items-center gap-3 flex-wrap">
      <h1 id="ola" class="text-2xl font-bold">Carregando...</h1>
      <span id="papel" class="hidden text-xs font-semibold text-violet-200 bg-violet-500/20 px-3 py-1 rounded-full">Administrador</span>
    </div>
    <p id="email" class="text-slate-400 mt-1"></p>
    <p class="text-slate-300 mt-6">Aqui vão ficar os seus arquivos e o seu plano. Esta área está em construção.</p>
  </div>
</main>

<script>
fetch("/api/me").then(function (r) {
  if (!r.ok) {
    window.location.href = "/entrar";
    return null;
  }
  return r.json();
}).then(function (u) {
  if (!u) return;
  document.getElementById("ola").textContent = "Olá, " + (u.nome || "cliente") + "!";
  document.getElementById("email").textContent = u.email;
  if (u.role === "admin") {
    document.getElementById("papel").classList.remove("hidden");
  }
});

document.getElementById("sair").addEventListener("click", function () {
  fetch("/api/logout", { method: "POST" }).then(function () {
    window.location.href = "/entrar";
  });
});
</script>
</body>
</html>
