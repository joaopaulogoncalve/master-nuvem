<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" role="img" aria-label="Mascote da Master Nuvem">
  <title>Master Nuvem</title>
  <defs>
    <linearGradient id="traco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd0ec"/>
      <stop offset=".55" stop-color="#3b8fe0"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <style>
      .olhos{transform-origin:120px 92px;animation:piscar 4.5s infinite}
      @keyframes piscar{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
      .pupila{animation:olhar 9s ease-in-out infinite}
      @keyframes olhar{0%,40%,100%{transform:translateX(0)}50%,60%{transform:translateX(3px)}70%,80%{transform:translateX(-3px)}}
    </style>
  </defs>
  <!-- corpo da nuvem -->
  <path d="M58 150 H182 C210 150 228 132 228 108 C228 86 212 70 192 68 C190 38 166 16 136 16 C114 16 98 28 90 44 C82 38 72 36 62 38 C42 42 30 60 32 80 C16 86 8 100 10 116 C12 136 30 150 58 150 Z"
        fill="#0b1430" stroke="url(#traco)" stroke-width="7" stroke-linejoin="round"/>
  <!-- malha (linhas finas) -->
  <g fill="none" stroke="url(#traco)" stroke-width="2.5" stroke-linecap="round" opacity=".75">
    <path d="M90 44 C100 60 104 78 96 96 C88 112 70 120 48 122"/>
    <path d="M136 16 C130 30 132 44 146 52 C168 64 188 64 192 68"/>
    <path d="M32 80 C52 86 70 82 84 70"/>
    <path d="M60 150 C90 132 140 118 228 108"/>
    <path d="M150 150 C160 136 172 126 190 118"/>
    <path d="M110 150 C112 140 114 134 118 128"/>
    <path d="M192 68 C202 80 206 94 204 108"/>
  </g>
  <!-- rosto -->
  <g class="olhos">
    <circle cx="100" cy="92" r="14" fill="#fff"/>
    <circle cx="140" cy="92" r="14" fill="#fff"/>
    <g class="pupila">
      <circle cx="100" cy="93" r="6.5" fill="#0b1430"/>
      <circle cx="140" cy="93" r="6.5" fill="#0b1430"/>
      <circle cx="102.5" cy="90.5" r="2" fill="#fff"/>
      <circle cx="142.5" cy="90.5" r="2" fill="#fff"/>
    </g>
  </g>
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
    <path d="M86 70 Q99 61 112 67"/>
    <path d="M128 67 Q141 61 154 70"/>
  </g>
</svg>
